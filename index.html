<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Desativa a tradução automática do navegador (Google Tradutor). O app é
         em português; quando o navegador traduz, ele substitui nós de texto do
         DOM e quebra o React com "Failed to execute 'insertBefore'..." (crash de
         tela branca relatado no Android). -->
    <meta name="google" content="notranslate" />
    <!-- A cor da barra do navegador no celular: o --afty-fundo, o fundo do site. -->
    <meta name="theme-color" content="#060910" />
    <title>Grimório F&amp;M</title>
    <!-- O título de cada rota sai antes do React, para a aba e a lista de abertos do
         celular mostrarem o nome certo desde o primeiro quadro. As expressões espelham
         as do App.jsx (e o asserts/t-app-rotas.mjs confere as duas). -->
    <script>
      (function () {
        var p = location.pathname;
        var biblioteca = p.replace(/\/encontros(?:\/[^/]+)?\/?$/i, "");
        var t = /^\/eradeouro\/?$/i.test(biblioteca) ? "Era de Ouro"
          : /^\/(?:jogador|player)\/?$/i.test(biblioteca) ? "Ficha de Jogador"
          : /^\/afty\/?$/i.test(biblioteca) ? "Grimório Afty"
          : /^\/eclesiastes\/?$/i.test(biblioteca) ? "Eclesiastes"
          : /^\/comunidade\/?$/i.test(p) ? "Comunidade | fichafm"
          : /^\/sala\//i.test(p) ? "Sala"
          : null;
        if (t) document.title = t;
      })();
    </script>
    <!-- O APP ERA DE OURO (etapa E4, docs/app-celular.md). Roda antes do React e antes da espera da nuvem:
         1. Em toda rota guarda o pedido de instalação do Chrome (`beforeinstallprompt`), que chega uma vez só e cedo. O
            convite da lista (src/celular/ConviteInstalar.jsx) o usa quando a pessoa toca em Instalar.
         2. Só em /EraDeOuro, e só no endereço novo ou no localhost, põe o manifesto e o ícone do app. Assim / e /Player não
            oferecem instalar um app chamado Era de Ouro, e o endereço antigo (grimorio-fm.vercel.app) nunca vira app. -->
    <script>
      (function () {
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          window.__fmPedidoInstalar = e;
          window.dispatchEvent(new Event("fm:instalavel"));
        });
        window.addEventListener("appinstalled", function () {
          window.__fmPedidoInstalar = null;
          window.__fmInstalado = true;
          window.dispatchEvent(new Event("fm:instalado"));
        });
        var h = location.hostname;
        var hostDoApp = h === "fichafm.com.br" || h === "www.fichafm.com.br" || h === "localhost" || h === "127.0.0.1";
        if (!hostDoApp || !/^\/eradeouro\/?$/i.test(location.pathname)) return;
        var cabeca = document.head;
        var link = function (rel, href, tipo) {
          var l = document.createElement("link");
          l.rel = rel;
          l.href = href;
          if (tipo) l.type = tipo;
          cabeca.appendChild(l);
        };
        var meta = function (nome, valor) {
          var m = document.createElement("meta");
          m.name = nome;
          m.content = valor;
          cabeca.appendChild(m);
        };
        link("manifest", "/manifest.webmanifest");
        link("apple-touch-icon", "/icons/era-de-ouro-180.png");
        meta("apple-mobile-web-app-title", "Era de Ouro");
        meta("mobile-web-app-capable", "yes");
        meta("apple-mobile-web-app-capable", "yes");
        meta("apple-mobile-web-app-status-bar-style", "black");
        var icone = document.querySelector('link[rel="icon"]');
        if (icone) {
          icone.href = "/icons/era-de-ouro.svg";
        }
        /* Etapa E5 (2026-11-19): a página vai até a borda do aparelho (as folhas usam a área segura) e o teclado encolhe a página, para a
           folha de baixo subir junto com ele em vez de ficar coberta. Só na Guilda, como o resto deste bloco. */
        var tela = document.querySelector('meta[name="viewport"]');
        if (tela) {
          tela.content = "width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content";
        }
        if (document.documentElement) document.documentElement.setAttribute("data-fm-app", "");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
